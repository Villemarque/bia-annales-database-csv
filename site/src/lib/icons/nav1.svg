<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 800 800"
   width="100%"
   height="100%"
   version="1.1"
   id="svg40"
   sodipodi:docname="nav1.svg"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview40"
     pagecolor="#000000"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.95688033"
     inkscape:cx="229.91381"
     inkscape:cy="98.758431"
     inkscape:window-width="1440"
     inkscape:window-height="900"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg40" />
  <defs
     id="defs17">
    <!-- Background Gradient (Midnight Spatial Dark) -->
    <linearGradient
       id="bg-grad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#242426"
         id="stop1" />
      <stop
         offset="40%"
         stop-color="#111112"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#050505"
         id="stop3" />
    </linearGradient>
    <!-- UI Glass Panel Gradients -->
    <linearGradient
       id="glass-panel"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.12"
         id="stop4" />
      <stop
         offset="100%"
         stop-color="#ffffff"
         stop-opacity="0.02"
         id="stop5" />
    </linearGradient>
    <linearGradient
       id="glass-edge"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.8"
         id="stop6" />
      <stop
         offset="25%"
         stop-color="#ffffff"
         stop-opacity="0.2"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#ffffff"
         stop-opacity="0.0"
         id="stop8" />
    </linearGradient>
    <linearGradient
       id="plane-body"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.9"
         id="stop9" />
      <stop
         offset="50%"
         stop-color="#dddddd"
         stop-opacity="0.7"
         id="stop10" />
      <stop
         offset="100%"
         stop-color="#888888"
         stop-opacity="0.9"
         id="stop11" />
    </linearGradient>
    <linearGradient
       id="path-grad"
       x1="0%"
       y1="100%"
       x2="100%"
       y2="0%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.1"
         id="stop12" />
      <stop
         offset="50%"
         stop-color="#ffffff"
         stop-opacity="0.8"
         id="stop13" />
      <stop
         offset="100%"
         stop-color="#ffffff"
         stop-opacity="1.0"
         id="stop14" />
    </linearGradient>
    <!-- Filters for Spatial Depth -->
    <filter
       id="shadow-extreme"
       x="-0.0028846154"
       y="-101.76185"
       width="1.0057692"
       height="204.44871">
      <feDropShadow
         dx="0"
         dy="40"
         stdDeviation="30"
         flood-color="#000000"
         flood-opacity="0.8" />
      <feDropShadow
         dx="0"
         dy="15"
         stdDeviation="10"
         flood-color="#000000"
         flood-opacity="0.5" />
    </filter>
    <filter
       id="shadow-mid"
       x="-0.069230769"
       y="-110.08138"
       width="1.0786058"
       height="221.16278">
      <feDropShadow
         dx="0"
         dy="12"
         stdDeviation="15"
         flood-color="#000000"
         flood-opacity="0.7" />
    </filter>
    <filter
       id="shadow-light"
       x="-0.16875"
       y="-0.19285715"
       width="1.3375"
       height="1.3857143">
      <feDropShadow
         dx="0"
         dy="4"
         stdDeviation="6"
         flood-color="#000000"
         flood-opacity="0.6" />
    </filter>
    <filter
       id="glow-heavy"
       x="-0.16875"
       y="-0.19285714"
       width="1.3375"
       height="1.3857143">
      <feGaussianBlur
         stdDeviation="20"
         result="blur"
         id="feGaussianBlur14" />
      <feMerge
         id="feMerge15">
        <feMergeNode
           in="blur"
           id="feMergeNode14" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode15" />
      </feMerge>
    </filter>
    <filter
       id="glow-soft"
       x="-inf"
       y="-110.14995"
       width="inf"
       height="221.29992">
      <feGaussianBlur
         stdDeviation="8"
         result="blur"
         id="feGaussianBlur15" />
      <feMerge
         id="feMerge17">
        <feMergeNode
           in="blur"
           id="feMergeNode16" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode17" />
      </feMerge>
    </filter>
  </defs>
  <!-- ========================================== -->
  <!-- LAYER 1: Background Compass & Radar HUD    -->
  <!-- ========================================== -->
  <!-- ========================================== -->
  <!-- LAYER 2: Navigational Globe / Grid Base    -->
  <!-- ========================================== -->
  <g
     transform="translate(0, 40)"
     filter="url(#shadow-light)"
     id="g25">
    <!-- Deep Space Glow Behind Grid -->
    <circle
       cx="400"
       cy="450"
       r="220"
       fill="#ffffff"
       opacity="0.02"
       filter="url(#glow-heavy)"
       id="circle22" />
    <!-- Globe Rings (Simulating 3D Topography) -->
    <circle
       cx="400"
       cy="450"
       r="220"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.1"
       id="circle23" />
    <ellipse
       cx="400"
       cy="450"
       rx="220"
       ry="140"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.15"
       id="ellipse23" />
    <ellipse
       cx="400"
       cy="450"
       rx="220"
       ry="60"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.15"
       id="ellipse24" />
    <!-- Vertical Longitude Arcs -->
    <path
       d="M 180,450 C 180,250 300,230 400,230 C 500,230 620,250 620,450 C 620,650 500,670 400,670 C 300,670 180,650 180,450"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.1"
       id="path24" />
    <path
       d="M 280,450 C 280,300 350,230 400,230 C 450,230 520,300 520,450 C 520,600 450,670 400,670 C 350,670 280,600 280,450"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.1"
       id="path25" />
    <line
       x1="400"
       y1="230"
       x2="400"
       y2="670"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.15"
       id="line25" />
  </g>
  <!-- ========================================== -->
  <!-- LAYER 3: Spatial Flight Path & Waypoints   -->
  <!-- ========================================== -->
  <!-- Waypoint Origin (Bottom Left) -->
  <g
     transform="translate(240, 560)"
     id="g27">
    <circle
       cx="0"
       cy="0"
       r="24"
       fill="none"
       stroke="#ffffff"
       stroke-width="2"
       stroke-dasharray="4 4"
       opacity="0.4"
       filter="url(#glow-soft)"
       id="circle25" />
    <circle
       cx="0"
       cy="0"
       r="8"
       fill="#ffffff"
       opacity="0.6"
       id="circle26" />
  </g>
  <!-- Ground Track (Shadow/Projection of the flight path on the grid) -->
  <path
     d="M 240,560 Q 320,430 560,370"
     fill="none"
     stroke="#000000"
     stroke-width="8"
     stroke-linecap="round"
     opacity="0.5"
     filter="url(#glow-soft)"
     id="path27" />
  <path
     d="M 240,560 Q 320,430 560,370"
     fill="none"
     stroke="#ffffff"
     stroke-width="2"
     stroke-dasharray="6 8"
     stroke-linecap="round"
     opacity="0.15"
     id="path28" />
  <!-- 3D Elevation Drop Line (Connects Plane to Ground) -->
  <line
     x1="430"
     y1="365"
     x2="430"
     y2="465"
     stroke="#ffffff"
     stroke-width="2"
     stroke-dasharray="4 6"
     opacity="0.5"
     filter="url(#glow-soft)"
     id="line28" />
  <!-- Ground Projection Node -->
  <ellipse
     cx="430"
     cy="465"
     rx="12"
     ry="6"
     fill="none"
     stroke="#ffffff"
     stroke-width="2"
     opacity="0.6"
     id="ellipse28" />
  <circle
     cx="430"
     cy="465"
     r="3"
     fill="#ffffff"
     opacity="0.8"
     id="circle28" />
  <!-- The Main Airborne Flight Path -->
  <g
     id="g41">
    <g
       filter="url(#glow-soft)"
       id="g30">
      <!-- Path Glow -->
      <path
         d="M 240,560 Q 300,280 560,280"
         fill="none"
         stroke="#ffffff"
         stroke-width="12"
         stroke-linecap="round"
         opacity="0.15"
         filter="url(#glow-heavy)"
         id="path29"
         style="display:inline" />
      <!-- Core Path -->
      <path
         d="M 240,560 Q 300,280 560,280"
         fill="none"
         stroke="url(#path-grad)"
         stroke-width="6"
         stroke-linecap="round"
         filter="url(#shadow-mid)"
         id="path30" />
    </g>
  </g>
  <!-- Waypoint Destination (Top Right) -->
  <g
     transform="translate(560, 280)"
     filter="url(#shadow-mid)"
     id="g33">
    <!-- Radar Ping Rings -->
    <circle
       cx="0"
       cy="0"
       r="45"
       fill="#ffffff"
       opacity="0.05"
       filter="url(#glow-soft)"
       id="circle30" />
    <circle
       cx="0"
       cy="0"
       r="30"
       fill="none"
       stroke="#ffffff"
       stroke-width="1.5"
       opacity="0.4"
       id="circle31" />
    <circle
       cx="0"
       cy="0"
       r="16"
       fill="url(#glass-panel)"
       stroke="#ffffff"
       stroke-width="2"
       id="circle32" />
    <circle
       cx="0"
       cy="0"
       r="6"
       fill="#ffffff"
       filter="url(#glow-soft)"
       id="circle33" />
    <!-- Nav Marker Label/Box -->
    <rect
       x="25"
       y="-12"
       width="60"
       height="24"
       rx="12"
       fill="url(#glass-panel)"
       stroke="#ffffff"
       stroke-width="1.5"
       stroke-opacity="0.4"
       id="rect33" />
    <line
       x1="38"
       y1="0"
       x2="72"
       y2="0"
       stroke="#ffffff"
       stroke-width="2"
       stroke-linecap="round"
       opacity="0.8"
       id="line33" />
  </g>
  <!-- ========================================== -->
  <!-- LAYER 4: The Airplane (Floating UI Element)-->
  <!-- ========================================== -->
  <!-- Positioned along the flight path curve -->
  <g
     transform="translate(430, 365) rotate(42)"
     filter="url(#shadow-extreme)"
     id="g40">
    <!-- Volumetric Edge Glow -->
    <path
       d="M -16,45 C -16,-30 0,-80 0,-80 C 0,-80 16,-30 16,45 C 16,90 0,105 0,105 C 0,105 -16,90 -16,45 Z"
       fill="none"
       stroke="#ffffff"
       stroke-width="10"
       opacity="0.15"
       filter="url(#glow-soft)"
       id="path33" />
    <!-- Swept Wings -->
    <path
       d="M -12,5 L -130,70 L -130,90 L -12,55 Z"
       fill="url(#plane-body)"
       stroke="#ffffff"
       stroke-width="1.5"
       id="path34" />
    <path
       d="M 12,5 L 130,70 L 130,90 L 12,55 Z"
       fill="url(#plane-body)"
       stroke="#ffffff"
       stroke-width="1.5"
       id="path35" />
    <!-- Horizontal Stabilizers (Tail Wings) -->
    <path
       d="M -8,80 L -45,110 L -45,120 L -5,98 Z"
       fill="url(#plane-body)"
       stroke="#ffffff"
       stroke-width="1.5"
       id="path36" />
    <path
       d="M 8,80 L 45,110 L 45,120 L 5,98 Z"
       fill="url(#plane-body)"
       stroke="#ffffff"
       stroke-width="1.5"
       id="path37" />
    <!-- Jet Engines -->
    <rect
       x="-45"
       y="55"
       width="14"
       height="30"
       rx="7"
       fill="#333"
       stroke="#fff"
       stroke-width="1.5"
       id="rect37" />
    <rect
       x="31"
       y="55"
       width="14"
       height="30"
       rx="7"
       fill="#333"
       stroke="#fff"
       stroke-width="1.5"
       id="rect38" />
    <!-- Fuselage (Main Body) -->
    <path
       d="M -16,45 C -16,-30 0,-80 0,-80 C 0,-80 16,-30 16,45 C 16,90 0,105 0,105 C 0,105 -16,90 -16,45 Z"
       fill="url(#plane-body)"
       stroke="#ffffff"
       stroke-width="2"
       id="path38" />
    <!-- Cockpit Window -->
    <path
       d="M -5,-50 Q 0,-65 5,-50 Q 0,-45 -5,-50 Z"
       fill="#111111"
       id="path39" />
    <!-- Top Highlight Glare on Fuselage -->
    <path
       d="M -4,45 C -4,-30 0,-70 0,-70 C 0,-70 4,-30 4,45 C 4,80 0,95 0,95 C 0,95 -4,80 -4,45 Z"
       fill="#ffffff"
       opacity="0.5"
       filter="url(#glow-soft)"
       id="path40" />
  </g>
  <!-- ========================================== -->
</svg>
